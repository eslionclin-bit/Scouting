# Bewust niet 'volley-scouting-sync'. Op die naam stond iets anders — de app
# zelf, via een build die in het Cloudflare-dashboard aan de repo was gekoppeld.
# Twee dingen die naar dezelfde naam uitrollen, winnen om beurten, en van
# buitenaf zie je alleen dat het soms niet werkt. Een eigen naam maakt dat
# onmogelijk.
name = "volley-sync"
main = "worker.js"
compatibility_date = "2026-01-01"

# De database wordt aangemaakt met:
#
#   npx wrangler d1 create volley-scouting --location weur
#
# `weur` is West-Europa: daarmee staan spelersnamen en wedstrijdgegevens hier
# en niet aan de andere kant van de oceaan. Het commando drukt een database_id
# af; die hoort hieronder.
#
# Rolt GitHub de server voor je uit, laat de plaatshouder dan staan: de
# workflow vult hem in vanuit het secret CLOUDFLARE_D1_ID. De id wijst naar het
# account van de eigenaar en hoort daarom niet in de repository.
[[d1_databases]]
binding = "DB"
database_name = "volley-scouting"
database_id = "vul-hier-de-id-in-die-wrangler-afdrukt"
