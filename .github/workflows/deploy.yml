# Zet de app online op GitHub Pages, zodat er een echte, installeerbare versie is
# om te laten zien. Draait bij elke push naar de ontwikkelbranch.
#
# Eenmalig aanzetten door de repo-eigenaar: Settings → Pages → Source: "GitHub
# Actions". Dat kan de workflow niet zelf doen — de token van een workflow mag
# wel naar Pages deployen, maar de site niet aanmaken.
#
# Daarna staat de app op https://<gebruiker>.github.io/<repo>/

name: Deploy

on:
  push:
    branches: ['claude/scouting-project-setup-wi6uwy', 'main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Bouwen
        # De app draait onder /<repo>/ op Pages, niet op de root.
        #
        # De twee Supabase-waarden zijn allebei publiek: de project-URL en de
        # anon-sleutel. Ze mogen in de gebouwde app staan, want op de server mag
        # die sleutel niets — alles loopt via functies die om de ploegcode
        # vragen, en die code staat alleen op het apparaat zelf. Ontbreken ze,
        # dan bouwt hij gewoon de puur lokale versie.
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: BASE_PATH="/${GITHUB_REPOSITORY#*/}/" npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    # Alleen vanaf de hoofdbranch: de github-pages-omgeving weigert deploys vanaf
    # een andere branch, en dat leverde bij elke push een foutmail op. Tests en
    # build draaien wél op elke branch — dat signaal is juist nuttig.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
