# Zet de app online op GitHub Pages, zodat er een echte, installeerbare versie is
# om te laten zien. Draait bij elke push naar de ontwikkelbranch.
#
# Eenmalig aanzetten door de repo-eigenaar: Settings → Pages → Source: "GitHub
# Actions". Dat kan de workflow niet zelf doen — de token van een workflow mag
# wel naar Pages deployen, maar de site niet aanmaken.
#
# Daarna staat de app op https://<gebruiker>.github.io/<repo>/

name: Deploy

on:
  push:
    branches: ['claude/scouting-project-setup-wi6uwy', 'main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Bouwen
        # De app draait onder /<repo>/ op Pages, niet op de root.
        #
        # Het adres van de sync-server, optioneel. Het mag in de gebouwde app
        # staan — hij doet niets zonder ploegcode, en die staat alleen op het
        # apparaat zelf — maar nodig is het niet: je kunt het adres ook in de app
        # invullen, en het reist mee in de koppellink. Dat is te verkiezen, want
        # ingebakken is het onzichtbaar en pas na een bouw te veranderen.
        #
        # En het adres van de deelserver van de trainingsapp. Staat dat er, dan
        # vraagt die app om inloggen; staat het er niet, dan blijft hij precies
        # wat hij zonder server is: alles op het apparaat zelf, zonder inlog.
        env:
          VITE_SYNC_URL: ${{ secrets.SYNC_URL }}
          VITE_TRAINING_SHARE_URL: ${{ secrets.TRAINING_SHARE_URL }}
        run: BASE_PATH="/${GITHUB_REPOSITORY#*/}/" npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    # Alleen vanaf de hoofdbranch: de github-pages-omgeving weigert deploys vanaf
    # een andere branch, en dat leverde bij elke push een foutmail op. Tests en
    # build draaien wél op elke branch — dat signaal is juist nuttig.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
