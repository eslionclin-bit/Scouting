# Zet de app online op GitHub Pages, zodat er een echte, installeerbare versie is
# om te laten zien. Draait bij elke push naar de ontwikkelbranch.
#
# De workflow zet Pages zelf aan (`enablement: true`), dus er hoeft niets met de
# hand geconfigureerd te worden. De app komt op
# https://<gebruiker>.github.io/<repo>/ te staan.

name: Deploy

on:
  push:
    branches: ['claude/scouting-project-setup-wi6uwy', 'main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Pages aanzetten en instellingen ophalen
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Bouwen
        # Het pad waaronder de app straks draait komt uit Pages zelf, zodat het
        # ook goed gaat bij een eigen domein op de root.
        run: BASE_PATH="${{ steps.pages.outputs.base_path }}/" npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
