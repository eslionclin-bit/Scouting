# Zet de sync-server op Cloudflare, zodat niemand ooit code in een dashboard
# hoeft te plakken.
#
# Draait alleen als er iets aan de server verandert — de app zelf heeft zijn
# eigen workflow. Ontbreken de gegevens, dan slaat hij zichzelf over: dat is de
# normale situatie voor wie de online koppeling niet gebruikt.
#
# Eenmalig instellen (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   — een token met rechten 'Workers Scripts: Edit' en
#                            'D1: Edit' op je account
#   CLOUDFLARE_ACCOUNT_ID  — staat in het adres van je Cloudflare-dashboard, het
#                            lange stuk na dash.cloudflare.com/
#   CLOUDFLARE_D1_ID       — de Database ID van je D1-database, te vinden op de
#                            pagina van die database

name: Sync-server

on:
  push:
    branches: ['main']
    paths: ['server/cloud/**', '.github/workflows/sync-server.yml']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Zwijgend overslaan is goed bij een gewone push: wie de online koppeling
      # niet gebruikt, hoeft er geen rood vinkje voor te zien. Maar wie deze
      # workflow zelf aanzet verwacht dat er iets gebeurt, en dan is 'geslaagd'
      # terwijl alles is overgeslagen een leugen die meer tijd kost dan een
      # eerlijke fout.
      - name: Zijn de gegevens er?
        id: check
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1: ${{ secrets.CLOUDFLARE_D1_ID }}
          VAR_TOKEN: ${{ vars.CLOUDFLARE_API_TOKEN }}
          VAR_ACCOUNT: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          VAR_D1: ${{ vars.CLOUDFLARE_D1_ID }}
        run: |
          # Witruimte eruit. Een token dat op een tablet uit een dashboard is
          # gekopieerd bevat zomaar een regeleinde, en dan komt het als
          # koptekst in een verzoek terecht en klapt de hele uitrol eruit op
          # 'invalid header value' — een melding waar je niets aan hebt. Deze
          # drie waarden bestaan alle drie uit hexadecimale tekens en streepjes,
          # dus er kan niets zinnigs sneuvelen.
          clean() { printf '%s' "$1" | tr -d '[:space:]'; }
          TOKEN_C=$(clean "$TOKEN")
          ACCOUNT_C=$(clean "$ACCOUNT")
          D1_C=$(clean "$D1")

          # Ook de opgeschoonde waarden uit de logs houden: GitHub maskeert
          # alleen wat er letterlijk in het secret staat.
          [ -n "$TOKEN_C" ] && echo "::add-mask::$TOKEN_C"
          [ -n "$D1_C" ] && echo "::add-mask::$D1_C"

          # Alleen de lengte, nooit de waarde. Genoeg om te zien of een secret
          # er is en of er witruimte in zat, en het verklapt niets — terwijl de
          # gemaskeerde waarde '***' precies dat verschil verbergt.
          echo "Wat deze workflow ziet:"
          printf '  %-24s %s tekens (%s na opschonen)\n' \
            CLOUDFLARE_API_TOKEN "${#TOKEN}" "${#TOKEN_C}"
          printf '  %-24s %s tekens (%s na opschonen)\n' \
            CLOUDFLARE_ACCOUNT_ID "${#ACCOUNT}" "${#ACCOUNT_C}"
          printf '  %-24s %s tekens (%s na opschonen)\n' \
            CLOUDFLARE_D1_ID "${#D1}" "${#D1_C}"

          # Een token bevat nooit witruimte, en bestaat alleen uit letters,
          # cijfers, streepjes, underscores en punten. Zit er iets anders in, dan
          # is er tekst omheen meegekopieerd — de zin erboven, of het
          # curl-voorbeeld dat eronder staat. Verderop levert dat 'Invalid format
          # for Authorization header' op, en aan die melding heb je niets.
          #
          # Bewust niet op lengte controleren: die verschilt per soort token
          # (oudere zijn 40 tekens, nieuwere hebben een voorvoegsel als 'cfat_'
          # en een controlegetal) en zal blijven veranderen.
          if [ "${#TOKEN}" -ne "${#TOKEN_C}" ]; then
            echo "::warning::In CLOUDFLARE_API_TOKEN zat witruimte ($(( ${#TOKEN} - ${#TOKEN_C} )) tekens). Een token bevat die nooit, dus er is waarschijnlijk tekst omheen meegekopieerd; kopieer alleen het token zelf."
          fi
          # Een account-token (cfat_) kan de rechten die wrangler nodig heeft niet
          # dragen — bekend probleem, en de fout die je ervoor terugkrijgt is
          # 'Invalid access token', wat naar van alles kan wijzen. Het moet een
          # gebruikerstoken zijn, aangemaakt onder My Profile.
          case "$TOKEN_C" in
            cfat_*)
              echo "::error::CLOUDFLARE_API_TOKEN is een account-token (begint met cfat_). Wrangler heeft een gebruikerstoken nodig: maak er een aan onder My Profile → API Tokens, met de sjabloon 'Edit Cloudflare Workers'."
              exit 1
              ;;
          esac

          if [ -n "$TOKEN_C" ] && printf '%s' "$TOKEN_C" | grep -q '[^A-Za-z0-9._-]'; then
            echo "::warning::CLOUDFLARE_API_TOKEN bevat tekens die niet in een token voorkomen. Kopieer alleen het token, zonder de tekst eromheen en zonder het woord Bearer."
          fi

          missing=""
          [ -n "$TOKEN_C" ]   || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$ACCOUNT_C" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ -n "$D1_C" ]      || missing="$missing CLOUDFLARE_D1_ID"

          if [ -z "$missing" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            {
              echo "CF_TOKEN=$TOKEN_C"
              echo "CF_ACCOUNT=$ACCOUNT_C"
              echo "CF_D1=$D1_C"
            } >> "$GITHUB_ENV"
            exit 0
          fi

          echo "ready=false" >> "$GITHUB_OUTPUT"

          # Verreweg de meest gemaakte vergissing: de pagina in GitHub heeft twee
          # tabbladen, Secrets en Variables, en ze zien er hetzelfde uit. Staat
          # het onder Variables, dan is het geen geheim en ziet deze workflow het
          # niet op de plek waar hij kijkt.
          hint=""
          if [ -n "$VAR_TOKEN$VAR_ACCOUNT$VAR_D1" ]; then
            hint=" Ze staan wel onder het tabblad Variables: zet ze over naar Secrets."
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "::error::De sync-server kan niet worden uitgerold, deze secrets ontbreken:$missing.$hint"
            exit 1
          fi

          echo "::warning::Sync-server overgeslagen, deze secrets ontbreken:$missing.$hint"

      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: 22

      # De database-id hoort niet in de repository: hij wijst naar het account
      # van de eigenaar, en die kan wisselen. Daarom staat er een plaatshouder
      # in wrangler.toml die hier wordt ingevuld.
      - name: Database-id invullen
        if: steps.check.outputs.ready == 'true'
        working-directory: server/cloud
        run: sed -i "s|vul-hier-de-id-in-die-wrangler-afdrukt|$CF_D1|" wrangler.toml

      # Het adres van de worker staat in de uitvoer hieronder; dat is de
      # waarde voor het secret SYNC_URL waarmee de app hem gaat gebruiken.
      - name: Uitrollen
        if: steps.check.outputs.ready == 'true'
        working-directory: server/cloud
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CF_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT }}
        run: npx --yes wrangler@4 deploy
