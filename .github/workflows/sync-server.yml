# Zet de sync-server op Cloudflare, zodat niemand ooit code in een dashboard
# hoeft te plakken.
#
# Draait alleen als er iets aan de server verandert — de app zelf heeft zijn
# eigen workflow. Ontbreken de twee secrets, dan slaat hij zichzelf over: dat is
# de normale situatie voor wie de online koppeling niet gebruikt.
#
# Eenmalig instellen (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   — een token met rechten 'Workers Scripts: Edit' en
#                            'D1: Edit' op je account
#   CLOUDFLARE_ACCOUNT_ID  — staat in het adres van je Cloudflare-dashboard, het
#                            lange stuk na dash.cloudflare.com/
#   CLOUDFLARE_D1_ID       — de Database ID van je D1-database, te vinden op de
#                            pagina van die database

name: Sync-server

on:
  push:
    branches: ['main']
    paths: ['server/cloud/**', '.github/workflows/sync-server.yml']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Zwijgend overslaan is goed bij een gewone push: wie de online koppeling
      # niet gebruikt, hoeft er geen rood vinkje voor te zien. Maar wie deze
      # workflow zelf aanzet verwacht dat er iets gebeurt, en dan is 'geslaagd'
      # terwijl alles is overgeslagen een leugen die meer tijd kost dan een
      # eerlijke fout.
      - name: Zijn de gegevens er?
        id: check
        run: |
          # Alleen de lengte, nooit de waarde: dat is genoeg om te zien of een
          # secret er is en verklapt niets. GitHub maskeert de waarde toch, maar
          # dan zie je '***' en weet je nog steeds niet of hij leeg is.
          echo "Wat deze workflow ziet:"
          printf '  %-24s %s tekens\n' CLOUDFLARE_API_TOKEN  "${#TOKEN}"
          printf '  %-24s %s tekens\n' CLOUDFLARE_ACCOUNT_ID "${#ACCOUNT}"
          printf '  %-24s %s tekens\n' CLOUDFLARE_D1_ID      "${#D1}"

          missing=""
          [ -n "$TOKEN" ]   || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$ACCOUNT" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ -n "$D1" ]      || missing="$missing CLOUDFLARE_D1_ID"

          if [ -z "$missing" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "ready=false" >> "$GITHUB_OUTPUT"

          # Verreweg de meest gemaakte vergissing: de pagina in GitHub heeft twee
          # tabbladen, Secrets en Variables, en ze zien er hetzelfde uit. Staat
          # het onder Variables, dan is het geen geheim en ziet deze workflow het
          # niet op de plek waar hij kijkt.
          hint=""
          if [ -n "$VAR_TOKEN$VAR_ACCOUNT$VAR_D1" ]; then
            hint=" Ze staan wel onder het tabblad Variables: zet ze over naar Secrets."
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "::error::De sync-server kan niet worden uitgerold, deze secrets ontbreken:$missing.$hint"
            exit 1
          fi

          echo "::warning::Sync-server overgeslagen, deze secrets ontbreken:$missing.$hint"
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1: ${{ secrets.CLOUDFLARE_D1_ID }}
          VAR_TOKEN: ${{ vars.CLOUDFLARE_API_TOKEN }}
          VAR_ACCOUNT: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          VAR_D1: ${{ vars.CLOUDFLARE_D1_ID }}

      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: 22

      # De database-id hoort niet in de repository: hij wijst naar het account
      # van de eigenaar, en die kan wisselen. Daarom staat er een plaatshouder
      # in wrangler.toml die hier wordt ingevuld.
      - name: Database-id invullen
        if: steps.check.outputs.ready == 'true'
        working-directory: server/cloud
        run: |
          sed -i "s|vul-hier-de-id-in-die-wrangler-afdrukt|${{ secrets.CLOUDFLARE_D1_ID }}|" wrangler.toml
          grep database_id wrangler.toml

      - name: Tabel klaarzetten
        if: steps.check.outputs.ready == 'true'
        working-directory: server/cloud
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # Alle statements zijn 'if not exists', dus dit mag elke keer draaien.
        run: npx --yes wrangler@4 d1 execute volley-scouting --remote --file schema.sql --yes

      # Het adres van de worker staat in de uitvoer hieronder; dat is de
      # waarde voor het secret SYNC_URL waarmee de app hem gaat gebruiken.
      - name: Uitrollen
        if: steps.check.outputs.ready == 'true'
        working-directory: server/cloud
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
